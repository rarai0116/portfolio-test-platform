appId: com.demoApp.demoTestManager
productName: demoTestManager
directories:
  buildResources: resources
  output: dist
files:
  - package.json
  - out/**
  - resources/**
  - '!out/**/*.map'
  - from: node_modules/better-sqlite3
    to: node_modules/better-sqlite3
  - from: ../../node_modules/.pnpm/bindings@1.5.0/node_modules/bindings
    to: node_modules/bindings
  - from: ../../node_modules/.pnpm/file-uri-to-path@1.0.0/node_modules/file-uri-to-path
    to: node_modules/file-uri-to-path

extraResources:
  - from: .env.prod
    to: env/.env.prod
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/build/**
win:
  executableName: demoTestManager
nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.invalid/updates/
extraMetadata:
  name: demoTestManager
