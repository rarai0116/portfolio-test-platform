<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>プレビュー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html {
      box-sizing: border-box;
      background-color: #F5F6F8;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    /* B5固定 */
    :root {
      --page-width-mm: 176;
      --page-height-mm: 250;
      --wrapper-pad-top-mm: 10;
      --wrapper-pad-right-mm: 20;
      --wrapper-pad-bottom-mm: 10;
      --wrapper-pad-left-mm: 10;
      --page-footer-reserve-mm: 20;
      --image-scale: 0.16;
      --size: B5 portrait;
      --font-size-pt: 10;
    }

    @page {
      size: var(--size);
      margin: 0;
    }

    body {
      margin: 0;
      padding: 16px 0;
      font-size: calc(var(--font-size-pt) * 1pt);
      font-family: MathMainForQ, 游明朝, "Hiragino Mincho ProN W3", "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", HG明朝E, "ＭＳ Ｐ明朝", "ＭＳ 明朝", serif !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      counter-increment: page 0;
      background: transparent;
    }

    .print-page,
    .print-firstpage {
      page-break-after: always;
      position: relative;
      width: calc(var(--page-width-mm) * 1mm);
      height: calc(var(--page-height-mm) * 1mm);
      padding: 5mm 10mm 0 10mm;
      /* 画面上の見た目 */
      background-color: #ffffff;
      margin: 16px auto;
      /* 中央寄せ＋ページ間の余白 */
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);

    }

    .print-page::after {
      counter-increment: page 1;
      content: "- " counter(page) " -";
      position: absolute;
      top: calc((var(--page-height-mm) - var(--page-footer-reserve-mm)) * 1mm + 5mm);
      left: 88mm;
    }

    .print-page.blank-page::after {
      counter-increment: none;
      content: none;
    }

    .page-counter-reset::before {
      counter-set: page 0;
    }

    .subcategory-name {
      font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Meiryo", sans-serif;
      font-weight: 600;
    }

    .question-wrapper,
    .answer-wrapper {
      page-break-inside: avoid;
      padding-top: calc(var(--wrapper-pad-top-mm) * 1mm);
      padding-right: calc(var(--wrapper-pad-right-mm) * 1mm);
      padding-bottom: calc(var(--wrapper-pad-bottom-mm) * 1mm);
      padding-left: calc(var(--wrapper-pad-left-mm) * 1mm);
      /*      width: 190mm;*/
      display: block;
      clear: both;
    }

    .question-num {
      display: inline-block;
    }

    .question-boxes {
      margin: 0 2mm;
    }

    .answer {
      font-weight: bold;
    }

    .katex {
      line-height: 1.2;
      text-indent: 1px;
    }

    img {
      display: inline-block;
      zoom: var(--image-scale);
      /*      height: auto;*/
      vertical-align: middle;
      image-rendering: -webkit-optimize-contrast;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;

    }

    /** 画像だけの行は字下げなし */
    .sub-dividable-sentence:has(> img:only-child),
    .sub-dividable-sentence:has(> img + img) {
      padding-left: 0;
    }

    .tmp {
      position: absolute;
      left: -10000px;
      top: 0;
      visibility: hidden;
      pointer-events: none;
      width: calc(var(--page-width-mm) * 1mm);
      /* 計測対象ページ幅に合わせる */
    }

    .category-wrapper {
      display: flex;
      align-items: center;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      margin-left: 3mm;
      min-width: 70px;
    }

    .page-div {
      font-size: 8pt;
    }

    .test-section-div {
      border: 1px solid rgba(0, 0, 0, 0);
      overflow: hidden;
    }

    .answer-title {
      font-size: 26pt;
      border: solid 0.3mm #000;
      padding: 0 3mm;
      margin: 0 0 5mm 0;
      display: inline-block;
    }

    .subject {
      font-size: 26pt;
      border: solid 0.3mm #000;
      padding-left: 1mm;
      padding-right: 1mm;
      margin: 5mm 0 2mm 0;
      display: inline-block;
    }

    .q-num {
      font-size: 26pt;
    }

    .title {
      font-size: 22pt;
      background: rgba(0, 0, 0, 0.1);
      padding: 0 2mm;
      margin-bottom: 5mm;
    }

    .category-title {
      font-size: 12pt;
    }

    .cover-note {
      font-size: 12pt;
    }

    .choices-p {
      padding-left: 4.4em;
      text-indent: -1.75em;
      page-break-inside: avoid;
    }

    .choice-group {
      text-indent: -1.75em;
      clear: both;
      padding-left: 4.125em;
    }

    /* 各選択肢ブロック内で float を閉じる */
    .choice-group>.sub-dividable-block {
      display: flow-root;
    }


    .top-level {
      display: inline;
      text-indent: -1.5em;
    }

    /* 既存の .top-level { display: inline; } の影響を限定解除 */
    .choice-group .top-level {
      display: block;
    }

    .ql-formula {
      display: inline-block;
      text-indent: initial;
      margin: 1mm 0;
      /* これがないと分数などが被ることがある*/
    }

    .float-image-run {
      clear: both;
      padding-left: 0;
      text-indent: 0;
    }

    .float-image-run img {
      float: none !important;
      display: inline-block !important;
      vertical-align: top;
    }

    .float-composite,
    .float-sentence {
      display: block;
      margin: 0;
      padding: 0;
      /*      text-indent: initial;*/
    }

    p {
      font-size: calc(var(--font-size-pt) * 1pt);
      padding: 0;
      margin: 0;
      text-indent: initial;
    }

    strong {
      font-family: 'MathMainForQ', 'Yu Gothic', 'YuGothic', 'Meiryo', serif;
    }

    .num-p {
      font-family: "Hiragino Sans W3", "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W3", "メイリオ", Meiryo, "ＭＳ Ｐゴシック", "MS PGothic", sans-serif;
      font-weight: bold;
      margin: 0;
      /*
      padding-left: 0.25em;
      padding-top: 5mm;
      */
    }

    .kotae {
      padding-right: 0.75em;
      padding-left: 1.25em;
    }

    /*
    img {
      zoom: 0.18;
      display: inline-block;
      height: auto;
      vertical-align: middle;
      image-rendering: -webkit-optimize-contrast;
    }
    */
    .float-and-float {
      clear: both;
    }

    .ql-indent-1 {
      padding-left: 3em !important;
    }

    .ql-indent-2 {
      padding-left: 6em !important;
    }

    .ql-indent-3 {
      padding-left: 9em !important;
    }

    .ql-indent-4 {
      padding-left: 12em !important;
    }

    .ql-indent-5 {
      padding-left: 15em !important;
    }

    .ql-indent-6 {
      padding-left: 18em !important;
    }

    .ql-indent-7 {
      padding-left: 21em !important;
    }

    .ql-indent-8 {
      padding-left: 24em !important;
    }

    .ql-indent-9 {
      padding-left: 27em !important;
    }

    /* 選択肢先頭pにql-indent-Nが付いた場合、番号(.choice-index-mark)だけを
       元のハンギング位置に戻し、番号ごと右にずれないようにする */
    [data-part$="choice"] p.ql-indent-1 .choice-index-mark { margin-left: -3em; }
    [data-part$="choice"] p.ql-indent-2 .choice-index-mark { margin-left: -6em; }
    [data-part$="choice"] p.ql-indent-3 .choice-index-mark { margin-left: -9em; }
    [data-part$="choice"] p.ql-indent-4 .choice-index-mark { margin-left: -12em; }
    [data-part$="choice"] p.ql-indent-5 .choice-index-mark { margin-left: -15em; }
    [data-part$="choice"] p.ql-indent-6 .choice-index-mark { margin-left: -18em; }
    [data-part$="choice"] p.ql-indent-7 .choice-index-mark { margin-left: -21em; }
    [data-part$="choice"] p.ql-indent-8 .choice-index-mark { margin-left: -24em; }
    [data-part$="choice"] p.ql-indent-9 .choice-index-mark { margin-left: -27em; }

    html[data-preview-scope='create-pdf'] img[data-preview-image-error='missing-size'] {
      outline: 1px solid #b42318;
      outline-offset: 2px;
    }

    .float-and-float {
      clear: both;
    }

    .measure-page-shell {
      position: absolute;
      left: -10000px;
      top: 0;
      visibility: hidden;
      pointer-events: none;
      width: calc(var(--page-width-mm) * 1mm);
      /* 本番の .print-page と同じ左右padding。ずれるとtmp計測幅が本番と食い違い、
         回り込み判定と高さ計測が実際のページと合わなくなる。 */
      padding: 5mm 10mm 0 10mm;
      /*      box-sizing: border-box;*/
      margin: 0;
      background: transparent;
      box-shadow: none;
    }
  </style>
  <style>
    html[data-show-measure-shells='1'] #page-body {
      display: grid;
      grid-template-columns: max-content max-content;
      gap: 24px 24px;
      align-items: start;
      justify-content: center;
    }

    html[data-show-measure-shells='1'] #title-container {
      grid-column: 1 / -1;
    }

    html[data-show-measure-shells='1'] #question-container {
      grid-column: 1;
      grid-row: 2;
    }

    html[data-show-measure-shells='1'] #tmp-question-container {
      grid-column: 2;
      grid-row: 2;
    }

    html[data-show-measure-shells='1'] #answer-container {
      grid-column: 1;
      grid-row: 3;
    }

    html[data-show-measure-shells='1'] #tmp-answer-container {
      grid-column: 2;
      grid-row: 3;
    }

    html[data-show-measure-shells='1'] .measure-page-shell {
      position: relative;
      left: auto;
      top: auto;
      visibility: visible;
      pointer-events: auto;
      margin: 16px auto;
      background-color: #fff;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.12);
    }

    html[data-show-measure-shells='1'] #tmp-question-container::before,
    html[data-show-measure-shells='1'] #tmp-answer-container::before,
    html[data-show-measure-shells='1'] #question-container::before,
    html[data-show-measure-shells='1'] #answer-container::before {
      display: block;
      margin-bottom: 8px;
      font: 600 12px/1.4 sans-serif;
      color: #555;
    }

    html[data-show-measure-shells='1'] #question-container::before {
      content: '本番 Question';
    }

    html[data-show-measure-shells='1'] #tmp-question-container::before {
      content: 'TMP Question';
    }

    html[data-show-measure-shells='1'] #answer-container::before {
      content: '本番 Answer';
    }

    html[data-show-measure-shells='1'] #tmp-answer-container::before {
      content: 'TMP Answer';
    }

    html[data-show-paginate-debug='1'] .paginate-debug-badge {
      position: absolute;
      right: 6mm;
      bottom: calc(var(--page-footer-reserve-mm) * 1mm + 2mm);
      z-index: 20;
      padding: 2px 6px;
      font: 11px/1.3 monospace;
      color: #7a1f1f;
      background: rgba(255, 245, 245, 0.95);
      border: 1px solid rgba(122, 31, 31, 0.25);
      border-radius: 4px;
      pointer-events: none;
    }

    .print-firstpage table {
      width: 154mm;
      border-collapse: collapse;
      margin: auto;
      margin-bottom: 15mm;
    }

    .print-firstpage td {
      font-size: 10pt;
      border-bottom: 0.3mm dashed #000000;
      padding-top: 2mm;
    }
  </style>
</head>

<body>
  <article id="page-body">
    <div id="title-container"></div>
    <div id="question-container"></div>
    <div id="answer-container"></div>
    <div id="tmp-question-container"></div>
    <div id="tmp-answer-container"></div>
  </article>

  <!-- 表紙テンプレート -->
  <div id="tmp-title" class="tmp">
    <section class="print-firstpage">
      <div class="flex-wrapper" style="display:flex;flex-direction:column;align-items:center;">
        <p class="subject"></p>
        <p class="q-num"></p>
        <p class="title"></p>
      </div>
      <p class="category-title">[項目]</p>
      <!-- テーブル挿入位置 -->
      <p class="cover-note">※(　)内は解説ページを示す</p>
      <div class="student-info"
        style="position:absolute;bottom:10mm;right:10mm;font-size:9pt;display:flex;flex-direction:column;align-items:flex-end;">
        <p class="student-class"
          style="border-bottom:0.3mm solid #000;margin-bottom:5mm;text-align:right;display:inline-block;">
          <span class="ka" style="padding-left:30mm;">科</span>
          <span class="nen" style="padding-left:10mm;">年</span>
          <span class="kumi" style="padding-left:10mm;">組</span>
          <span class="ban" style="padding-left:10mm;">番</span>
        </p>
        <p class="student-name"
          style="border-bottom:0.3mm solid #000;padding-right:50mm;text-align:right;display:inline-block;">氏名</p>
      </div>
    </section>
    <section class="print-page blank-page"></section>
  </div>

  <!-- 問題テンプレート -->
  <div id="tmp-question" class="tmp">
    <div class="num-to-ichimonme sub-dividable-group">
      <p class="num-p sub-dividable-block">
        <span class="question-meta sub-dividable-sentence">
          <span class="no"> </span><span class="no-display"></span>
        </span>
      </p>
      <p class="question-honbun sub-dividable-block"></p>
    </div>
    <div class="choice-group sub-dividable-group">
    </div>
  </div>

  <!-- 解説テンプレート -->
  <div id="tmp-answer" class="tmp">
    <div class="num-to-ichimonme sub-dividable-group">
      <p class="num-p sub-dividable-block">
        <span class="answer-meta sub-dividable-sentence">
          <span class="no"></span>
          <span class="kotae"></span>
          <span class="year"></span>
          <span class="difficult"></span>
        </span>
      </p>
      <p class="answer-honbun sub-dividable-block"></p>
    </div>
    <div class="choice-group sub-dividable-group">
    </div>
  </div>
</body>

</html>
