- 仕様を固めるための不足点、矛盾、リスク、セキュリティ懸念を洗い出します。
- 人の指示なしに工程を開始、省略、完了、次工程移行しません。
- 実装は行いません。
- docs/.ai-works は読んで構いませんが、現行仕様の正本として扱いません。
- archive documents は人が明示した場合のみ参照します。

出力では、入力整理、不足情報、仕様ドラフトまたはタスク一覧案、主要な懸念点、次に人が判断すべき点を明示してください。
"""